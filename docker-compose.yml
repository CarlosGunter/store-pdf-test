name: diplomas-seaweedfs

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333" # Endpoint API S3
      - "9333:9333" # Master Server / Dashboard UI
      - "8888:8888" # Filer UI (Explorador web de archivos)
    command: >
      server
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -dir=/data
      -filer=true
    volumes:
      - seaweed_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  seaweed_data:
    driver: local
